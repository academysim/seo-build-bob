<form action='/success-quote' class='qf-form' method='POST' name='event-quote'>
      <input type="hidden" name="form-name" value="event-quote">
      <p class="qf-hp"><label>Leave blank: <input name="bot-field"></label></p>
      <div class="qf-grid">
        <div class="qf-field"><label>Name <span class="req">*</span></label><input type="text" name="name" required></div>
        <div class="qf-field"><label>Company / Organization</label><input type="text" name="company"></div>
        <div class="qf-field"><label>Email <span class="req">*</span></label><input type="email" name="email" required></div>
        <div class="qf-field"><label>Phone <span class="req">*</span></label><input type="tel" name="phone" required></div>
        <div class="qf-field"><label>Event Type <span class="req">*</span></label>
          <select name="event_type" required>
            <option value="">Select…</option>
            <option>Corporate Event</option>
            <option>Trade Show / Expo</option>
            <option>Dealership Activation</option>
            <option>Brand Launch / Activation</option>
            <option>Private Party / Celebration</option>
            <option>Race Watch Party</option>
            <option>Public Safety / Community</option>
            <option>Other</option>
          </select>
        </div>
        <div class="qf-field"><label>Event Date (if known)</label><input type="date" name="event_date"></div>
        <div class="qf-field"><label>Venue / City</label><input type="text" name="venue" placeholder="e.g. Tampa Convention Center"></div>
        <div class="qf-field"><label>Estimated Guests</label>
          <select name="guests">
            <option value="">Select…</option>
            <option>Under 25</option><option>25–75</option><option>75–200</option><option>200–500</option><option>500+</option>
          </select>
        </div>
        <div class="qf-field"><label>Simulators Needed</label>
          <select name="simulators">
            <option value="">Not sure, recommend for me</option>
            <option>1</option>
            <option>2</option>
            <option>3–4</option>
            <option>5–6</option>
            <option>7–10</option>
            <option>10+</option>
          </select>
        </div>
        <div class="qf-field full"><label>Tell us about your event</label><textarea name="details" placeholder="Goals, audience, timing, branding needs, anything that helps us scope it."></textarea></div>
      </div>
      <div class="qf-submit" style="text-align:center;"><button type="submit" class="btn-amber" style="font-size:13px; padding:15px 30px;">SEND QUOTE REQUEST →</button></div>
      <div class="qf-note">Response within 1 business day · Or call (813) 355-9071</div>
      <div class="qf-error" id="err-quote">Something went wrong. Please call (813) 355-9071 or email info@academysim.com.</div>
    </form>
