name: Safety gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # upload/ is build output and is not committed; rebuild it from site/ so
      # Gate 1 proves the build reproduces the pre-Bob bytes exactly.
      - name: Build upload/ from source
        run: python shared/tools/build_all.py

      - name: Gate 1 – verify baseline hashes
        run: python shared/tools/verify_baseline.py

      - name: Gate 2 – unit tests
        run: python -m unittest discover -s shared/tests

      - name: Gate 3 – lounge audit
        run: python lounge/tools/audit_site.py

      - name: Gate 4 – events audit
        run: python events/tools/events_audit.py

      - name: Gate 5 – builds audit
        run: python builds/tools/builds_audit.py

      - name: Gate 6 – health audit
        run: python health/tools/health_audit.py

      - name: Gate 7 – driver audit
        run: python driver/tools/driver_audit.py
